name: Build and deploy Node.js app to Azure Web App - freelancers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"

      - name: Clean previous build
        run: rm -rf .next

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          NODE_ENV: production
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ENCRYPT: ${{ secrets.DB_ENCRYPT }}
          DB_TRUST_SERVER_CERTIFICATE: ${{ secrets.DB_TRUST_SERVER_CERTIFICATE }}
          DB_ENABLE_ARITH_ABORT: ${{ secrets.DB_ENABLE_ARITH_ABORT }}
          DB_CONNECTION_TIMEOUT: ${{ secrets.DB_CONNECTION_TIMEOUT }}
          DB_REQUEST_TIMEOUT: ${{ secrets.DB_REQUEST_TIMEOUT }}
          DB_POOL_MAX: ${{ secrets.DB_POOL_MAX }}
          DB_POOL_MIN: ${{ secrets.DB_POOL_MIN }}
          DB_POOL_IDLE_TIMEOUT: ${{ secrets.DB_POOL_IDLE_TIMEOUT }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_BLOB_CONTAINER_NAME: ${{ secrets.AZURE_BLOB_CONTAINER_NAME }}
          AZURE_BLOB_SAS_TOKEN: ${{ secrets.AZURE_BLOB_SAS_TOKEN }}
          AZURE_BLOB_SAS_URL: ${{ secrets.AZURE_BLOB_SAS_URL }}
          AZURE_BLOB_BASE_URL: ${{ secrets.AZURE_BLOB_BASE_URL }}
          VIEW_FREELANCERS: ${{ secrets.VIEW_FREELANCERS }}
          VIEW_FREELANCER_LINKS: ${{ secrets.VIEW_FREELANCER_LINKS }}
          VIEW_DEPARTMENTS_SKILLS: ${{ secrets.VIEW_DEPARTMENTS_SKILLS }}
          VIEW_FREELANCER_SKILLS: ${{ secrets.VIEW_FREELANCER_SKILLS }}
          VIEW_SERVICES: ${{ secrets.VIEW_SERVICES }}
          VIEW_CATEGORIES: ${{ secrets.VIEW_CATEGORIES }}
          VIEW_SERVICE_CATEGORIES: ${{ secrets.VIEW_SERVICE_CATEGORIES }}
          VIEW_STORED_DOCUMENTS: ${{ secrets.VIEW_STORED_DOCUMENTS }}
          TABLE_FREELANCER_WEBSITE_DATA: ${{ secrets.TABLE_FREELANCER_WEBSITE_DATA }}
          TABLE_FREELANCER_WEBSITE_DATA_LINKS: ${{ secrets.TABLE_FREELANCER_WEBSITE_DATA_LINKS }}
          TABLE_STORED_DOCUMENTS: ${{ secrets.TABLE_STORED_DOCUMENTS }}
          STATUS_NONE: ${{ secrets.STATUS_NONE }}
          STATUS_TO_BE_VERIFIED: ${{ secrets.STATUS_TO_BE_VERIFIED }}
          STATUS_VERIFIED: ${{ secrets.STATUS_VERIFIED }}
          STATUS_REJECTED: ${{ secrets.STATUS_REJECTED }}
          DOC_TYPE_PHOTO: ${{ secrets.DOC_TYPE_PHOTO }}
          DOC_TYPE_CV: ${{ secrets.DOC_TYPE_CV }}
          DOC_TYPE_EQUIPMENT_LIST: ${{ secrets.DOC_TYPE_EQUIPMENT_LIST }}
          LINK_TYPE_WEBSITE: ${{ secrets.LINK_TYPE_WEBSITE }}
          LINK_TYPE_INSTAGRAM: ${{ secrets.LINK_TYPE_INSTAGRAM }}
          LINK_TYPE_IMDB: ${{ secrets.LINK_TYPE_IMDB }}
          LINK_TYPE_LINKEDIN: ${{ secrets.LINK_TYPE_LINKEDIN }}
          GRAPH_SENDER_EMAIL: ${{ secrets.GRAPH_SENDER_EMAIL }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_SENDER_TEST_EMAIL: ${{ secrets.GRAPH_SENDER_TEST_EMAIL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          MAX_FILE_SIZE_IMAGE: ${{ secrets.MAX_FILE_SIZE_IMAGE }}
          MAX_FILE_SIZE_CV: ${{ secrets.MAX_FILE_SIZE_CV }}
          MAX_FILE_SIZE_EQUIPMENT: ${{ secrets.MAX_FILE_SIZE_EQUIPMENT }}
          ALLOWED_IMAGE_TYPES: ${{ secrets.ALLOWED_IMAGE_TYPES }}
          ALLOWED_DOCUMENT_TYPES: ${{ secrets.ALLOWED_DOCUMENT_TYPES }}
          SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          DEFAULT_PAGE_SIZE: ${{ secrets.DEFAULT_PAGE_SIZE }}
          MAX_PAGE_SIZE: ${{ secrets.MAX_PAGE_SIZE }}
          CACHE_TTL: ${{ secrets.CACHE_TTL }}
          NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}
        run: npm run build

      # Install only production dependencies into a clean folder.
      # This replaces "npm prune --production" and avoids the tar.gz extraction problem.
      - name: Install production dependencies only
        run: npm ci --omit=dev

      # Stage only what the server needs — no dev files, no source, no test fixtures.
      # The app start command (node node_modules/.bin/next start) is configured
      # directly in the Azure App Service startup command setting.
      #
      # KEY FIX: We wipe deploy_package/.next entirely and re-copy from the fresh
      # build AFTER staging everything else. This guarantees the zip contains only
      # one coherent version of .next — one [turbopack]_runtime.js paired with
      # exactly the chunks it references. No stale runtime, no missing modules.
      - name: Stage deployment package
        run: |
          mkdir -p deploy_package
          cp -r public deploy_package/
          cp package.json deploy_package/
          cp package-lock.json deploy_package/
          cp next.config.mjs deploy_package/
          # proxy.js — rate limiter, renamed from middleware.js per Next.js 16
          # deprecation. Must sit at the project root for Next.js to pick it up.
          cp proxy.js deploy_package/
          # node_modules already pruned to production deps above
          cp -r node_modules deploy_package/
          # Tell Oryx not to run npm install — we have already done it.
          echo "{ \"packageManager\": \"npm\" }" > deploy_package/oryx-manifest.json
          # Copy the entire fresh .next last, as a single atomic step.
          # Never copy .next piecemeal — the runtime and chunks must always
          # come from the same build or MODULE_NOT_FOUND errors will occur.
          cp -r .next deploy_package/.next
          echo "✅ SSR chunk count: $(ls deploy_package/.next/server/chunks/ssr/ 2>/dev/null | wc -l)"

      # Zip the deploy package before uploading.
      #
      # This is the most important change from the previous YAML.
      #
      # When package: points to a directory, azure/webapps-deploy does a slow
      # file-by-file sync (additive merge). It uploads files one at a time and
      # never deletes files on the server that are absent from the package.
      # Azure App Service watches wwwroot for changes and can restart the Node
      # process mid-sync — at which point the new [turbopack]_runtime.js may be
      # on disk but only some of the chunks it references have arrived yet.
      # Confirmed root cause: grep for stale chunk hashes (8c1f7cd5, d03d2993)
      # on the live server returned nothing — the old runtime was looking for
      # chunks that the new build never generated.
      #
      # When package: points to a ZIP file, Kudu uses its zip deploy API instead.
      # The zip is uploaded as a single blob, then extracted atomically on the
      # server in one operation before the process restarts. No partial state,
      # no mid-upload restart, no stale runtime surviving from a previous build.
      - name: Zip deployment package
        run: |
          cd deploy_package
          zip -r ../deploy.zip . -x "*.git*"
          cd ..
          echo "✅ Deploy zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7F5B70189A8245CDB40B9AE7570D679E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_46C3936B6C5E47F597FDFCDE2D07700B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_239BA5D8191C47D58FCFF65D9CF7C57E }}

      - name: Deploy built app
        uses: azure/webapps-deploy@v3
        with:
          app-name: "freelancers"
          slot-name: "Production"
          package: deploy.zip
