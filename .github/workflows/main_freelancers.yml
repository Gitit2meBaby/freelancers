name: Deploy Freelancers to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"

      - name: Install all dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ENCRYPT: ${{ secrets.DB_ENCRYPT }}
          DB_TRUST_SERVER_CERTIFICATE: ${{ secrets.DB_TRUST_SERVER_CERTIFICATE }}
          DB_ENABLE_ARITH_ABORT: ${{ secrets.DB_ENABLE_ARITH_ABORT }}
          DB_CONNECTION_TIMEOUT: ${{ secrets.DB_CONNECTION_TIMEOUT }}
          DB_REQUEST_TIMEOUT: ${{ secrets.DB_REQUEST_TIMEOUT }}
          DB_POOL_MAX: ${{ secrets.DB_POOL_MAX }}
          DB_POOL_MIN: ${{ secrets.DB_POOL_MIN }}
          DB_POOL_IDLE_TIMEOUT: ${{ secrets.DB_POOL_IDLE_TIMEOUT }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_BLOB_CONTAINER_NAME: ${{ secrets.AZURE_BLOB_CONTAINER_NAME }}
          AZURE_BLOB_SAS_TOKEN: ${{ secrets.AZURE_BLOB_SAS_TOKEN }}
          AZURE_BLOB_BASE_URL: ${{ secrets.AZURE_BLOB_BASE_URL }}
          AZURE_BLOB_SAS_URL: ${{ secrets.AZURE_BLOB_SAS_URL }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SENDER_EMAIL: ${{ secrets.GRAPH_SENDER_EMAIL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Stage deployment package
        run: |
          mkdir -p deploy_package

          # Copy everything that is NOT .next first
          cp -r public deploy_package/
          cp package.json deploy_package/
          cp package-lock.json deploy_package/
          cp next.config.mjs deploy_package/
          cp -r node_modules deploy_package/

          # Rate limiter — proxy.js (renamed from middleware.js for Next.js 16)
          # Must be at project root or it never runs. Confirmed present on server
          # after rollback (Apr 10 16:52) — must survive every future deploy.
          cp proxy.js deploy_package/

          # Tell Oryx not to re-run npm install
          echo '{ "packageManager": "npm" }' > deploy_package/oryx-manifest.json

          # Copy startup.sh — runs on every container boot before Next.js starts.
          # Wipes stale SSR chunks from previous builds so Turbopack never loads
          # an old chunk that conflicts with the current [turbopack]_runtime.js.
          # This is the self-healing mechanism: even if Kudu's zip extract is
          # additive, the app cleans itself before serving any requests.
          cp startup.sh deploy_package/
          chmod +x deploy_package/startup.sh

          # Copy .next ONCE, cleanly, as the final step.
          # NEVER pre-copy and re-copy — if the destination exists, cp -r copies
          # INTO it rather than replacing it, creating deploy_package/.next/.next.
          # This single explicit copy guarantees one coherent build in the zip:
          # one [turbopack]_runtime.js paired with exactly the chunks it expects.
          cp -r .next deploy_package/.next

          # Verify the chunk count looks sane for a single build
          CHUNK_COUNT=$(ls deploy_package/.next/server/chunks/ssr/*.js 2>/dev/null | wc -l)
          echo "✅ SSR chunk count: $CHUNK_COUNT"
          if [ "$CHUNK_COUNT" -lt 50 ]; then
            echo "❌ ERROR: Chunk count $CHUNK_COUNT is too low — build may be incomplete. Aborting."
            exit 1
          fi
          if [ "$CHUNK_COUNT" -gt 300 ]; then
            echo "❌ ERROR: Chunk count $CHUNK_COUNT is too high — stale chunks in deploy package. Aborting."
            exit 1
          fi

      - name: Zip deployment package
        run: |
          cd deploy_package
          zip -r ../deploy.zip . -x "*.git*"
          cd ..
          echo "✅ Deploy zip size: $(du -sh deploy.zip | cut -f1)"
          SIZE_BYTES=$(stat -c%s deploy.zip)
          if [ "$SIZE_BYTES" -lt 10000000 ]; then
            echo "❌ ERROR: deploy.zip is under 10MB — something is missing. Aborting."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "freelancers"
          slot-name: "Production"
          package: deploy.zip
